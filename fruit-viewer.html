<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: transparent;
      pointer-events: none;
    }
  </style>
</head>

<body>

<model-viewer
  src="./fruit_reserve2.glb"
  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="12deg"
  camera-orbit="0deg 75deg auto"
  field-of-view="30deg"
  exposure="1.2"
  shadow-intensity="0">
</model-viewer>

</body>
</html>
